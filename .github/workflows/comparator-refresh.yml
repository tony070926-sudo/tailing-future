name: Comparator freshness

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('evaluation/baselines/registry.json', 'utf8'));
            const age = Math.floor((Date.now() - Date.parse(`${registry.snapshotDate}T00:00:00Z`)) / 86400000);
            if (age <= 30) return;
            const title = `Sentinel: refresh comparator registry (${registry.snapshotDate})`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open'
            });
            if (existing.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: `The locked comparator registry is ${age} days old. A SOTA Scout must review primary papers, official model cards, licenses and revisions, then open a human-reviewed registry PR. Do not silently change current benchmark thresholds.`
            });
