name: Tailing Sentinel

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.11
      - id: install
        continue-on-error: true
        run: npm ci
      - id: lint
        if: always()
        continue-on-error: true
        run: npm run lint
      - id: typecheck
        if: always()
        continue-on-error: true
        run: npm run typecheck
      - id: test
        if: always()
        continue-on-error: true
        run: npm test
      - id: atomistic_manifest
        if: always()
        continue-on-error: true
        run: npm run atomistic:validate
      - id: build
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_TAILING_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - id: audit
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=low
      - if: always()
        run: rm -f evaluation/latest-report.json evaluation/latest-report.md evaluation/public-summary.json evaluation/public-product-evaluation.json
      - id: sentinel
        if: always()
        continue-on-error: true
        env:
          TAILING_INSTALL_STATUS: ${{ steps.install.outcome }}
          TAILING_LINT_STATUS: ${{ steps.lint.outcome }}
          TAILING_TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          TAILING_TEST_STATUS: ${{ steps.test.outcome }}
          TAILING_ATOMISTIC_MANIFEST_STATUS: ${{ steps.atomistic_manifest.outcome }}
          TAILING_BUILD_STATUS: ${{ steps.build.outcome }}
          TAILING_AUDIT_STATUS: ${{ steps.audit.outcome }}
        run: npm run evaluate
      - id: report_build
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_TAILING_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - id: release_manifest
        if: always()
        continue-on-error: true
        run: npm run release:manifest
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailing-sentinel-${{ github.sha }}
          include-hidden-files: true
          path: |
            .release-artifact/manifest.json
            dist/
            evaluation/latest-report.json
            evaluation/latest-report.md
            evaluation/public-summary.json
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailing-sentinel-pr-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluation/latest-report.md
          if-no-files-found: error
          retention-days: 1
      - if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          TEST_STATUS: ${{ steps.test.outcome }}
          ATOMISTIC_MANIFEST_STATUS: ${{ steps.atomistic_manifest.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          AUDIT_STATUS: ${{ steps.audit.outcome }}
          SENTINEL_STATUS: ${{ steps.sentinel.outcome }}
          REPORT_BUILD_STATUS: ${{ steps.report_build.outcome }}
          RELEASE_MANIFEST_STATUS: ${{ steps.release_manifest.outcome }}
        run: |
          node -e "const failed = ['INSTALL','LINT','TYPECHECK','TEST','ATOMISTIC_MANIFEST','BUILD','AUDIT','SENTINEL','REPORT_BUILD','RELEASE_MANIFEST'].filter(name => process.env[name + '_STATUS'] !== 'success'); if (failed.length) { console.error('Failed gates: ' + failed.join(', ')); process.exit(1); }"
