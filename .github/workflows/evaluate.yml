name: Tailing Sentinel

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - id: sentinel
        continue-on-error: true
        run: npm run evaluate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailing-sentinel-${{ github.sha }}
          path: |
            evaluation/latest-report.json
            evaluation/latest-report.md
      - if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tailing-sentinel -->';
            const body = `${marker}\n${fs.readFileSync('evaluation/latest-report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - if: steps.sentinel.outcome == 'failure'
        run: exit 1
