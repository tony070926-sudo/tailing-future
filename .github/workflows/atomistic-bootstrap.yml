            }
            const bytes = execFileSync('git', ['cat-file', 'blob', source.gitBlobOid], { ...gitOptions, maxBuffer: 5 * 1024 * 1024 + 1 });
            if (bytes.length !== source.sizeBytes || sha256(bytes) !== source.sha256 || gitBlobOid(bytes) !== source.gitBlobOid) {
              throw new Error(`P blob identity differs for ${source.path}.`);
            }
            sourceBytes.set(source.path, bytes);
            writeExclusiveRegular(runtimeSourceRoot, source.path, bytes, source.sha256);
