      - name: Freeze and verify the exact resolved wheel set
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$WHEELHOUSE" = "$ATOMISTIC_ROOT/wheelhouse"
          test "$(realpath "$WHEELHOUSE")" = "$WHEELHOUSE"
          test -d "$WHEELHOUSE"
          test ! -L "$WHEELHOUSE"
          test "$(stat -c '%u' "$WHEELHOUSE")" = "$(id -u)"
          find "$WHEELHOUSE" -mindepth 1 -maxdepth 1 -type f -exec chmod 0444 {} +
          chmod 0555 "$WHEELHOUSE"
          find "$LOCK_DIR" -mindepth 1 -maxdepth 1 -type f -exec chmod 0444 {} +
          chmod 0555 "$LOCK_DIR"
          find "$MANIFEST_DIR" -mindepth 1 -maxdepth 1 -type f -exec chmod 0444 {} +
          chmod 0555 "$MANIFEST_DIR"
          node --input-type=module <<'NODE'
          import { constants, createHash } from 'node:crypto';
          import { constants as fsConstants } from 'node:fs';
          import { lstat, open, readFile, readdir, realpath, stat } from 'node:fs/promises';
          import path from 'node:path';

          const digestFile = async (filename) => {
            const before = await lstat(filename, { bigint: true });
            if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1n || (before.mode & 0o777n) !== 0o444n) {
              throw new Error(`${path.basename(filename)} is not one immutable regular file.`);
            }
            const handle = await open(filename, fsConstants.O_RDONLY | (fsConstants.O_NOFOLLOW ?? 0));
            const hash = createHash('sha256');
            try {
              const buffer = Buffer.allocUnsafe(1024 * 1024);
              for (;;) {
                const { bytesRead } = await handle.read(buffer, 0, buffer.length, null);
                if (bytesRead === 0) break;
                hash.update(buffer.subarray(0, bytesRead));
              }
              const after = await handle.stat({ bigint: true });
              if (before.dev !== after.dev || before.ino !== after.ino || before.size !== after.size || before.mtimeNs !== after.mtimeNs) {
                throw new Error(`${path.basename(filename)} changed during verification.`);
              }
            } finally {
              await handle.close();
            }
            return { sizeBytes: Number(before.size), sha256: `sha256:${hash.digest('hex')}` };
          };

          const wheelhouse = process.env.WHEELHOUSE;
          const lockDir = process.env.LOCK_DIR;
          if (await realpath(wheelhouse) !== wheelhouse || await realpath(lockDir) !== lockDir) {
            throw new Error('Wheelhouse or lock directory is not canonical.');
          }
          for (const directory of [wheelhouse, lockDir]) {
            const metadata = await lstat(directory, { bigint: true });
            if (!metadata.isDirectory() || metadata.isSymbolicLink() || (metadata.mode & 0o777n) !== 0o555n) {
              throw new Error(`${directory} is not an immutable real directory.`);
            }
          }
          const manifestPath = path.join(lockDir, `${process.env.MODEL}.wheelhouse.manifest.json`);
          const lockPath = path.join(lockDir, `${process.env.MODEL}.requirements.lock`);
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          if (manifest.schemaVersion !== 'tf.atomistic-wheelhouse-manifest/0.1' || manifest.model !== process.env.MODEL) {
            throw new Error('Resolver manifest identity drifted.');
          }
          const expectedStartupHookRemovals = [{
            archivePath: 'distutils-precedence.pth',
            installPath: 'site-packages/distutils-precedence.pth',
            sha256: 'sha256:2638ce9e2500e572a5e0de7faed6661eb569d1b696fcba07b0dd223da5f5d224',
            sizeBytes: 151,
            wheelFilename: 'setuptools-84.0.0-py3-none-any.whl',
          }];
          if (JSON.stringify(manifest.startupHookRemovals) !== JSON.stringify(expectedStartupHookRemovals)
              || manifest.runtimeInstalledFileCount !== manifest.installedFileCount - 1
              || !/^sha256:[0-9a-f]{64}$/.test(manifest.runtimeInstalledPathDigest)
              || manifest.runtimeInstalledPathDigest === manifest.installedPathDigest) {
            throw new Error('Resolver startup-hook removal plan drifted.');
          }
          const directoryEntries = await readdir(wheelhouse, { withFileTypes: true });
          if (directoryEntries.some((entry) => !entry.isFile() || entry.isSymbolicLink())) {
            throw new Error('Wheelhouse contains a non-regular entry.');
          }
          const filenames = directoryEntries.map((entry) => entry.name).sort();
          const declared = Array.isArray(manifest.wheels) ? manifest.wheels : [];
          const declaredNames = declared.map((wheel) => wheel.filename).sort();
          if (manifest.wheelCount !== declared.length || filenames.length !== declared.length || JSON.stringify(filenames) !== JSON.stringify(declaredNames)) {
            throw new Error('Wheelhouse count or exact filename set differs from the resolver manifest.');
          }
          const declaredStartupHookRemovals = declared.flatMap((wheel) => wheel.startupHookRemovals ?? []);
          if (JSON.stringify(declaredStartupHookRemovals) !== JSON.stringify(expectedStartupHookRemovals)) {
            throw new Error('Per-wheel startup-hook removal plan drifted.');
          }
          if (process.env.MODEL === 'mattersim') {
            const versions = Object.fromEntries(declared.map((wheel) => [wheel.normalizedName, wheel.version]));
            if (versions.pymatgen !== '2025.4.17'
                || versions['pymatgen-io-validation'] !== '0.1.2'
                || Object.hasOwn(versions, 'pymatgen-core')) {
              throw new Error('MatterSim pymatgen compatibility closure drifted.');
            }
          }
          const seen = new Set();
          for (const wheel of declared) {
            if (seen.has(wheel.filename) || path.basename(wheel.filename) !== wheel.filename || !wheel.filename.endsWith('.whl')) {
              throw new Error('Resolver manifest contains a duplicate or unsafe wheel filename.');
            }
            seen.add(wheel.filename);
            const actual = await digestFile(path.join(wheelhouse, wheel.filename));
            if (actual.sizeBytes !== wheel.sizeBytes || actual.sha256 !== wheel.sha256) {
              throw new Error(`${wheel.filename} differs from its resolver digest.`);
            }
          }
          const lock = await digestFile(lockPath);
          await digestFile(manifestPath);
          if (lock.sha256 !== manifest.lockDigest) throw new Error('Generated lock differs from resolver manifest.');
          const planBytes = await readFile('evaluation/atomistic/reproduction-plan.json');
          const planDigest = `sha256:${createHash('sha256').update(planBytes).digest('hex')}`;
          if (planDigest !== manifest.planDigest) throw new Error('Resolver manifest is bound to a different plan.');
          NODE
          echo "bf517278cd097517953609e089fd29aae7de5472d5e59a63624eb1bce3f93f5c  scripts/atomistic/verify_runtime_inventory.py" | sha256sum -c -
          python3 -I -S -B scripts/atomistic/verify_runtime_inventory.py \
            --wheelhouse "$WHEELHOUSE" \
            --manifest "$LOCK_DIR/$MODEL.wheelhouse.manifest.json"
          echo "ed1198bf0206be6e7de22dd8a84aaed751762c83cdec2f5328fe7021816be3cb  scripts/atomistic/runtime-input-contract.mjs" | sha256sum -c -
          node scripts/atomistic/runtime-input-contract.mjs verify-exact \
            --model "$MODEL" \
            --plan evaluation/atomistic/reproduction-plan.json \
            --wheelhouse-manifest "$LOCK_DIR/$MODEL.wheelhouse.manifest.json" \
            --dockerfile "atomistic/containers/$MODEL.Dockerfile" \
            --dockerignore .dockerignore \
            --dependency-lock "$LOCK_DIR/$MODEL.requirements.lock" \
            --run-model scripts/atomistic/run_model.py \
            --runtime-contract scripts/atomistic/runtime_contract.py \
            --runtime-source-revision "$RUNTIME_SOURCE_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output "$LOCK_DIR/$MODEL.runtime-inputs.json" \
            > "$ATOMISTIC_ROOT/$MODEL.runtime-inputs.verify.json"
          cmp --silent \
            "$ATOMISTIC_ROOT/$MODEL.runtime-inputs.result.json" \
            "$ATOMISTIC_ROOT/$MODEL.runtime-inputs.verify.json"
          test "sha256:$(sha256sum "$LOCK_DIR/$MODEL.runtime-inputs.json" | cut -d ' ' -f 1)" = "$RUNTIME_INPUT_MANIFEST_DIGEST"

      - name: Prove a cold, hash-locked install with no network
        id: cold_install
        shell: bash
        run: |
