            }
          }

          const planBytes = readBoundedRegularFile('evaluation/atomistic/reproduction-plan.json', 64 * 1024);
          const plan = JSON.parse(planBytes);
          const runtimeLockBytes = readBoundedRegularFile('evaluation/atomistic/runtime-lock.json', 64 * 1024);
          const runtimeLock = JSON.parse(runtimeLockBytes);
          const planDigest = sha256(planBytes);
          const runtimeLockDigest = sha256(runtimeLockBytes);
          const expectedModelIds = {
            mattersim: 'mattersim-v1.0.0-5m',
            mace: 'mace-mpa-0-medium',
          };
          if (!Object.hasOwn(expectedModelIds, process.env.MODEL)) throw new Error('Unexpected matrix model.');
          const expectedRunner = {
            python: '3.12.13',
            platform: 'linux',
            architecture: 'x86_64',
            baseImage: process.env.BASE_IMAGE,
            baseImageAmd64Digest: process.env.BASE_IMAGE_AMD64_DIGEST,
            dtype: 'float32',
            canonicalDevice: 'cpu',
            batchSize: 1,
            threads: 1,
            networkPolicy: 'fetch-online-run-offline',
            isolation: 'verified-pickle-in-networkless-unprivileged-read-only-container',
          };
          if (plan.schemaVersion !== 'tf.atomistic-reproduction/0.2') {
            throw new Error('Unexpected atomistic reproduction-plan schema.');
          }
          if (planDigest !== expectedPlanDigest
              || runtimeLock.schemaVersion !== 'tf.atomistic-runtime-lock/0.2'
              || runtimeLockDigest !== expectedRuntimeLockDigest
              || runtimeLock.state !== 'discovery-not-frozen'
              || runtimeLock.scientificPlan?.rawDigest !== planDigest
              || runtimeLock.claims?.evidenceClass !== 'discovery-only-not-reproduced'
              || runtimeLock.claims?.promotionEligible !== false
              || runtimeLock.claims?.comparable !== false
              || runtimeLock.claims?.reproduced !== false
              || runtimeLock.runtimeSource?.runtimeSourceRevision !== expectedRuntimeSourceRevision
              || runtimeLock.runtimeSource?.sourceDateEpoch !== expectedSourceDateEpoch
              || runtimeLock.runtimeSource?.sourceManifestProtocol !== 'sha256-canonical-json-ordered-path-mode-size-sha256/v1'
              || runtimeLock.runtimeSource?.sourceManifestDigest !== expectedSourceManifestDigest
              || runtimeLock.runtimeSource?.materializationProtocol !== 'sha256-canonical-json-ordered-runtime-materializations/v1'
              || runtimeLock.runtimeSource?.materializationDigest !== expectedMaterializationDigest
              || canonicalJson(runtimeLock.runtimeSource?.files) !== canonicalJson(expectedSources.map(({ gitBlobOid: ignored, ...source }) => source))
              || canonicalJson(runtimeLock.runtimeSource?.materializations) !== canonicalJson(expectedMaterializations)
              || sha256(Buffer.from(canonicalJson(runtimeLock.runtimeSource.files), 'utf8')) !== expectedSourceManifestDigest
              || sha256(Buffer.from(canonicalJson(runtimeLock.runtimeSource.materializations), 'utf8')) !== expectedMaterializationDigest
              || runtimeLock.plannedBuildContract?.schemaVersion !== 'tf.atomistic-runtime-inputs/0.2'
              || runtimeLock.plannedBuildContract?.runtimeInputManifestProtocol !== 'sha256-canonical-json-plus-lf-tf.atomistic-runtime-inputs-0.2/v1'
              || runtimeLock.identities?.runnerDigest !== null
              || runtimeLock.replication?.observations?.length !== 0) {
            throw new Error('Runtime discovery lock is incomplete or not bound to the scientific plan.');
          }
          const gitEnvironment = {
            PATH: process.env.PATH,
            GIT_CONFIG_NOSYSTEM: '1',
            GIT_CONFIG_SYSTEM: '/dev/null',
            GIT_CONFIG_GLOBAL: '/dev/null',
            GIT_NO_REPLACE_OBJECTS: '1',
            GIT_OPTIONAL_LOCKS: '0',
            LC_ALL: 'C',
          };
          const gitOptions = { env: gitEnvironment, stdio: ['ignore', 'pipe', 'pipe'] };
          execFileSync('git', ['cat-file', '-e', `${expectedRuntimeSourceRevision}^{commit}`], gitOptions);
          execFileSync('git', ['merge-base', '--is-ancestor', expectedRuntimeSourceRevision, 'HEAD'], gitOptions);
          const commitTimestamp = Number(execFileSync(
            'git',
            ['show', '-s', '--format=%ct', expectedRuntimeSourceRevision],
            { ...gitOptions, encoding: 'utf8' },
          ).trim());
          if (commitTimestamp !== expectedSourceDateEpoch) {
            throw new Error('Runtime source commit timestamp differs from the discovery lock.');
          }

          const runtimeSourceRoot = realpathSync(process.env.RUNTIME_SOURCE_ROOT);
          const buildContext = realpathSync(process.env.BUILD_CONTEXT);
          const leftToRight = path.relative(runtimeSourceRoot, buildContext);
          const rightToLeft = path.relative(buildContext, runtimeSourceRoot);
          const overlaps = (relative) => relative === '' || (!relative.startsWith(`..${path.sep}`) && relative !== '..' && !path.isAbsolute(relative));
          if (overlaps(leftToRight) || overlaps(rightToLeft)) throw new Error('Runtime source and build roots must be disjoint.');

          const sourceBytes = new Map();
          for (const source of expectedSources) {
            const treeBytes = execFileSync(
              'git',
              ['ls-tree', '-z', expectedRuntimeSourceRevision, '--', source.path],
              { ...gitOptions, maxBuffer: 8192 },
            );
            const records = treeBytes.toString('utf8').split('\0').filter((entry) => entry !== '');
            const match = records.length === 1 ? /^(\d{6}) (\S+) ([0-9a-f]{40})\t(.+)$/.exec(records[0]) : null;
