              ),
              (
                  "https://files.pythonhosted.org/packages/0b/2c/87f3254fd8ffd29e4c02732eee68a83a1d3c346ae39bc6822dcbcb697f2b/wheel-0.45.1-py3-none-any.whl",
                  "/inputs/tools/wheel-0.45.1-py3-none-any.whl",
                  72494,
                  "708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248",
              ),
          )
          for url, destination, expected_size, expected_sha256 in assets:
              partial = destination + ".partial"
              request = urllib.request.Request(url, headers={"User-Agent": "tailing-future-atomistic-bootstrap/0.3.1"})
              digest = hashlib.sha256()
              written = 0
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
