                -mindepth 1 -maxdepth 1 \
                \( -type f -o -type l -o -type d \) \
                \( -iname \*.pth -o -iname sitecustomize -o -iname sitecustomize.\* \
                  -o -iname usercustomize -o -iname usercustomize.\* \) -print -quit)"
              test -z "$unexpected_hooks"
