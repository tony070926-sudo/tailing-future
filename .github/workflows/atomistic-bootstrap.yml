          const materializationsBySource = new Map(expectedMaterializations.map((mapping) => [mapping.sourcePath, mapping]));
          const selectedBuildSources = new Set([
            '.dockerignore',
            `atomistic/containers/${process.env.MODEL}.Dockerfile`,
            ...expectedMaterializations.map((mapping) => mapping.sourcePath),
          ]);
          const buildPaths = new Set();
          for (const source of expectedSources) {
            if (!selectedBuildSources.has(source.path)) continue;
            const mapping = materializationsBySource.get(source.path);
            const buildPath = mapping?.buildPath ?? source.path;
            if (buildPaths.has(buildPath)) throw new Error(`Duplicate build materialization path: ${buildPath}`);
            buildPaths.add(buildPath);
            writeExclusiveRegular(buildContext, buildPath, sourceBytes.get(source.path), source.sha256);
          }
