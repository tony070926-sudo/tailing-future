            echo "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922  $SOURCE_BUILD_INPUTS/tools/setuptools-80.9.0-py3-none-any.whl" | sha256sum -c -
            echo "708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248  $SOURCE_BUILD_INPUTS/tools/wheel-0.45.1-py3-none-any.whl" | sha256sum -c -
            echo "dffc06ecc2faab2b6e0fe729ac1c16dda524edff76297a06e20b839832e1e120  atomistic/locks/python-hostlist-build.requirements.lock" | sha256sum -c -
            echo "f004a9c004d4a91f985c0bc87b76e3ad9b7d9cb8a5428413b4732d3ff6d0cb84  scripts/atomistic/build_python_hostlist_wheel.sh" | sha256sum -c -
            echo "eb411a80b63e3a98599f07d8275460a44866f1f8d7b13be738686621e311d9e5  scripts/atomistic/verify_derived_wheel.py" | sha256sum -c -
            install -m 0444 \
              atomistic/locks/python-hostlist-build.requirements.lock \
              "$SOURCE_BUILD_INPUTS/build-tools.requirements.lock"
            install -m 0444 \
              scripts/atomistic/build_python_hostlist_wheel.sh \
              "$SOURCE_BUILD_INPUTS/build_python_hostlist_wheel.sh"
            find "$SOURCE_BUILD_INPUTS" -type f -exec chmod 0444 {} +
            find "$SOURCE_BUILD_INPUTS" -type d -exec chmod 0555 {} +
            for derived_output in "$SOURCE_BUILD_A" "$SOURCE_BUILD_B"; do
              test -z "$(find "$derived_output" -mindepth 1 -maxdepth 1 -print -quit)"
              docker run --rm --platform=linux/amd64 \
                --network=none \
                --read-only \
                --user="$(id -u):$(id -g)" \
                --cap-drop=ALL \
