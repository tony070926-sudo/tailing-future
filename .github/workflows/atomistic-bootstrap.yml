# Bootstrap-only prediction workflow.
#
# This workflow deliberately does not compute metrics, create a reproduction
# receipt, attest an artifact, or make a reproduced/superiority claim. Its
# artifacts are untrusted inputs for a later independent verifier.
name: Atomistic bootstrap predictions (non-promotional)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomistic-bootstrap-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_IMAGE: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
  BASE_IMAGE_AMD64_DIGEST: sha256:6e13e65c55e33adf203d77ee371cf8bf5d81bd4902ef07565721f46bf44917af
  DOCKERFILE_FRONTEND: docker/dockerfile:1.7@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e

jobs:
  bootstrap:
    name: ${{ matrix.model }} isolated bootstrap smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [mattersim, mace]
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Check out the dispatched revision without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned JavaScript runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0

      - name: Refuse non-main, non-Linux, or non-x86_64 dispatches
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import {
            closeSync,
            constants as fsConstants,
            fstatSync,
            lstatSync,
            openSync,
            realpathSync,
            readSync,
          } from 'node:fs';
          import path from 'node:path';

          const quarantinePath = 'evaluation/atomistic/bootstrap-quarantine.json';
          const expectedQuarantineRawDigest = 'sha256:65af8aae9d84281899116cca55dd883611a28eae453d0b190c737ec29bcd13a3';
          const expectedQuarantine = {
            schemaVersion: 'tf.atomistic-bootstrap-quarantine/0.2',
            state: 'active',
            enforcementMode: 'deny-quarantined-require-exact-selected/v1',
            quarantinedRunner: {
              runnerDigest: 'sha256:2c708fc0220808cc4b2e2f3043623f604793f7bd8a5913472440f91f17a3987c',
              runnerDigestProtocol: 'sha256-canonical-json-sorted-runner-file-identities/v1',
              runtimeSourceRevision: '9a67f4509588d242838c736a580b6ec5badc18f9',
              runtimeLock: {
                revision: 'f861b3e30572f1db366554a2e330d5d6c78bdb56',
                path: 'evaluation/atomistic/runtime-lock.json',
                rawDigest: 'sha256:79e72ba821cfaac298a4898a9b09bd4f0159d3560cdf8f2ac5ba4b005402f6fe',
              },
              scientificPlan: {
                revision: 'f861b3e30572f1db366554a2e330d5d6c78bdb56',
                path: 'evaluation/atomistic/reproduction-plan.json',
                rawDigest: 'sha256:d3a58524029b51c598d00a7bb9f60b6479a9973a0f9907cbf94a31e61bf1c9c2',
              },
              reasonCode: 'contradictory-bootstrap-promotion-claim',
              reason: 'The locked R5 runner emits environment.provenance.promotionEligible=true in bootstrap-not-reproduced output and conflates workflow and runtime-source revisions.',
              acceptedReplicaCount: 0,
              nonRetroactiveRunIds: [33231316217, 33231323492],
            },
            selectedRunner: {
              implementation: 'tf.atomistic-runner/v2',
              runnerDigest: 'sha256:d6e83640f15926088c116312c27605570f9e9c8ba4e9a9988ef5bf4d3a974ed4',
              runnerDigestProtocol: 'sha256-canonical-json-sorted-name-standard-container-path-size-sha256/v1',
              runtimeSourceRevision: 'f861b3e30572f1db366554a2e330d5d6c78bdb56',
              sourceDateEpoch: 1787977543,
              sourceManifestProtocol: 'sha256-canonical-json-ordered-path-mode-size-sha256/v1',
              sourceManifestDigest: 'sha256:08b1ed2ae239ce5732cf565b5e7bd814727a99ad6e1e1a29aeaa21ea1ed529a1',
              sourceFiles: [
                {
                  path: '.dockerignore',
                  gitBlobOid: '7dd2587d66b2803b491e281044f90e4f654ab861',
                  mode: '100644',
                  sizeBytes: 338,
                  sha256: 'sha256:9d49b6272e10c9c791f6c1288f6df858141bda4613085cc3a811d6edd4aa3ab3',
                },
                {
                  path: 'atomistic/containers/mace.Dockerfile',
                  gitBlobOid: '0edc70ad532de4470efff5c170a20f17a94c4847',
                  mode: '100644',
                  sizeBytes: 3338,
                  sha256: 'sha256:d97f48e8d8d75c2b4d22acf46ec5aa7ba21cb2acd59db7a4745e2021f4438b5f',
                },
                {
                  path: 'atomistic/containers/mattersim.Dockerfile',
                  gitBlobOid: 'be08afa1d04a4078a559bf2d0eca1bd66eaebb0c',
                  mode: '100644',
                  sizeBytes: 3533,
                  sha256: 'sha256:d672230adbc540391e8be4424aca24c50e473ca46a5a244d06838f55cc288455',
                },
                {
                  path: 'scripts/atomistic/v2/run_model.py',
                  gitBlobOid: '6da2a799a8fcba7ada0c3c3922de03f8fa72807a',
                  mode: '100644',
                  sizeBytes: 35311,
                  sha256: 'sha256:f0f0e2dd09784de064f2ba552a90a390523cd9af4244c0853118317bb42a36bb',
                },
                {
                  path: 'scripts/atomistic/v2/runtime_contract.py',
                  gitBlobOid: '38a2d2e263d7f25893ec5a79353300ba6ad7eb42',
                  mode: '100644',
                  sizeBytes: 53577,
                  sha256: 'sha256:0a7f2e6e92cfdaeea0a9b532b152fa32c3a562500d7e1962a1573a8b072c34e2',
                },
              ],
              materializationMethod: 'immutable-git-source-to-isolated-build-context-to-standard-container/v1',
              materializationProtocol: 'sha256-canonical-json-ordered-runtime-materializations/v1',
              materializationDigest: 'sha256:345d5e55227bbe873d567f5ea72b88db1f21c1d46e72f078db38e6a455d47721',
              materializations: [
                {
                  name: 'run_model.py',
                  sourcePath: 'scripts/atomistic/v2/run_model.py',
                  buildPath: 'scripts/atomistic/run_model.py',
                  standardContainerPath: '/opt/tailing-venv/lib/python3.12/site-packages/run_model.py',
                  sizeBytes: 35311,
                  mode: '100644',
                  sha256: 'sha256:f0f0e2dd09784de064f2ba552a90a390523cd9af4244c0853118317bb42a36bb',
                },
                {
                  name: 'runtime_contract.py',
                  sourcePath: 'scripts/atomistic/v2/runtime_contract.py',
                  buildPath: 'scripts/atomistic/runtime_contract.py',
                  standardContainerPath: '/opt/tailing-venv/lib/python3.12/site-packages/runtime_contract.py',
                  sizeBytes: 53577,
                  mode: '100644',
                  sha256: 'sha256:0a7f2e6e92cfdaeea0a9b532b152fa32c3a562500d7e1962a1573a8b072c34e2',
                },
              ],
            },
            claims: {
              evidenceClass: 'bootstrap-not-reproduced',
              promotionEligible: false,
              comparable: false,
              reproduced: false,
            },
          };

          function sha256(bytes) {
            return `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          }

          function canonicalJson(value) {
            if (value === null) return 'null';
            if (Array.isArray(value)) return `[${value.map((entry) => canonicalJson(entry)).join(',')}]`;
            if (typeof value === 'object') {
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          }

          function readBoundedRegularFile(filename, maximumBytes) {
            const absolute = path.resolve(filename);
            if (realpathSync(filename) !== absolute) {
              throw new Error(`${filename} is not one canonical non-symlink path.`);
            }
            const descriptor = openSync(filename, fsConstants.O_RDONLY | fsConstants.O_NOFOLLOW);
            try {
              const before = fstatSync(descriptor, { bigint: true });
              if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1n
                  || before.size < 1n || before.size > BigInt(maximumBytes)) {
                throw new Error(`${filename} is not one bounded regular file.`);
              }
              const bytes = Buffer.alloc(Number(before.size));
              let offset = 0;
              while (offset < bytes.length) {
                const count = readSync(descriptor, bytes, offset, bytes.length - offset, null);
                if (count === 0) throw new Error(`${filename} changed while it was read.`);
                offset += count;
              }
              if (readSync(descriptor, Buffer.alloc(1), 0, 1, null) !== 0) {
                throw new Error(`${filename} exceeded its byte bound while it was read.`);
              }
              const after = fstatSync(descriptor, { bigint: true });
              const afterPath = lstatSync(filename, { bigint: true });
              if (realpathSync(filename) !== absolute
                  || !afterPath.isFile() || afterPath.isSymbolicLink() || afterPath.nlink !== 1n
                  || before.dev !== after.dev || before.ino !== after.ino || before.size !== after.size
                  || before.mode !== after.mode || before.mtimeNs !== after.mtimeNs || before.ctimeNs !== after.ctimeNs
                  || afterPath.dev !== after.dev || afterPath.ino !== after.ino || afterPath.size !== after.size) {
                throw new Error(`${filename} changed while it was read.`);
              }
              return bytes;
            } finally {
              closeSync(descriptor);
            }
          }

          function gitBlobOid(bytes) {
            return createHash('sha1').update(`blob ${bytes.length}\0`, 'utf8').update(bytes).digest('hex');
          }

          const gitEnvironment = {
            PATH: process.env.PATH,
            GIT_CONFIG_NOSYSTEM: '1',
            GIT_CONFIG_SYSTEM: '/dev/null',
            GIT_CONFIG_GLOBAL: '/dev/null',
            GIT_NO_REPLACE_OBJECTS: '1',
            GIT_OPTIONAL_LOCKS: '0',
            LC_ALL: 'C',
          };
          const gitOptions = { cwd: process.cwd(), env: gitEnvironment, stdio: ['ignore', 'pipe', 'pipe'] };

          function gitBytes(arguments_, maximumBytes) {
            const bytes = execFileSync('git', arguments_, { ...gitOptions, maxBuffer: maximumBytes + 1 });
            if (bytes.length > maximumBytes) throw new Error(`Git object exceeded ${maximumBytes} bytes.`);
            return bytes;
          }

          function readCommitBlob(revision, sourcePath, expected, maximumBytes) {
            const tree = gitBytes(['ls-tree', '-z', revision, '--', sourcePath], 8192);
            const records = tree.toString('utf8').split('\0').filter((entry) => entry !== '');
            if (records.length !== 1) throw new Error(`Git tree has no unique entry for ${sourcePath}.`);
            const match = /^(\d{6}) (\S+) ([0-9a-f]{40,64})\t(.+)$/.exec(records[0]);
            if (!match || match[2] !== 'blob' || match[4] !== sourcePath || match[1] !== expected.mode
                || (expected.gitBlobOid !== undefined && match[3] !== expected.gitBlobOid)) {
              throw new Error(`Git tree identity differs for ${sourcePath}.`);
            }
            const bytes = gitBytes(['cat-file', 'blob', match[3]], maximumBytes);
            if (gitBlobOid(bytes) !== match[3]
                || (expected.sizeBytes !== undefined && bytes.length !== expected.sizeBytes)
                || (expected.sha256 !== undefined && sha256(bytes) !== expected.sha256)) {
              throw new Error(`Git blob bytes differ for ${sourcePath}.`);
            }
            return { bytes, gitBlobOid: match[3], mode: match[1] };
          }

          const quarantineBytes = readBoundedRegularFile(quarantinePath, 16 * 1024);
          if (sha256(quarantineBytes) !== expectedQuarantineRawDigest) {
            throw new Error('Bootstrap quarantine bytes differ from the reviewed policy.');
          }
          const quarantine = JSON.parse(quarantineBytes);
          if (JSON.stringify(quarantine) !== JSON.stringify(expectedQuarantine)) {
            throw new Error('Bootstrap quarantine schema or values differ from the reviewed policy.');
          }

          const currentRuntimeLockBytes = readBoundedRegularFile('evaluation/atomistic/runtime-lock.json', 64 * 1024);
          if (sha256(currentRuntimeLockBytes) !== 'sha256:5ce8c368b73f2f34e414caa349b89096ee844b3135a724045e65fbb5bd1aed2e') {
            throw new Error('Current runtime lock bytes differ from the reviewed v0.2 policy.');
          }
          const currentRuntimeLock = JSON.parse(currentRuntimeLockBytes);
          const selectedSourceFiles = quarantine.selectedRunner.sourceFiles.map((source) => ({
            path: source.path,
            sizeBytes: source.sizeBytes,
            mode: source.mode,
            sha256: source.sha256,
          }));
          if (currentRuntimeLock.schemaVersion !== 'tf.atomistic-runtime-lock/0.2'
              || currentRuntimeLock.runtimeSource?.runtimeSourceRevision !== quarantine.selectedRunner.runtimeSourceRevision
              || currentRuntimeLock.runtimeSource?.sourceDateEpoch !== quarantine.selectedRunner.sourceDateEpoch
              || currentRuntimeLock.runtimeSource?.sourceManifestProtocol !== quarantine.selectedRunner.sourceManifestProtocol
              || currentRuntimeLock.runtimeSource?.sourceManifestDigest !== quarantine.selectedRunner.sourceManifestDigest
              || currentRuntimeLock.runtimeSource?.materializationProtocol !== quarantine.selectedRunner.materializationProtocol
              || currentRuntimeLock.runtimeSource?.materializationDigest !== quarantine.selectedRunner.materializationDigest
              || canonicalJson(currentRuntimeLock.runtimeSource?.files) !== canonicalJson(selectedSourceFiles)
              || canonicalJson(currentRuntimeLock.runtimeSource?.materializations) !== canonicalJson(quarantine.selectedRunner.materializations)
              || sha256(Buffer.from(canonicalJson(selectedSourceFiles), 'utf8')) !== quarantine.selectedRunner.sourceManifestDigest
              || sha256(Buffer.from(canonicalJson(quarantine.selectedRunner.materializations), 'utf8')) !== quarantine.selectedRunner.materializationDigest
              || currentRuntimeLock.identities?.runnerDigest !== null
              || currentRuntimeLock.replication?.observations?.length !== quarantine.quarantinedRunner.acceptedReplicaCount
              || currentRuntimeLock.claims?.evidenceClass !== 'discovery-only-not-reproduced'
              || currentRuntimeLock.claims?.promotionEligible !== false
              || currentRuntimeLock.claims?.comparable !== false
              || currentRuntimeLock.claims?.reproduced !== false) {
            throw new Error('Current runtime lock and selected runner quarantine do not share the reviewed v0.2 boundary.');
          }

          const sourceRevision = quarantine.selectedRunner.runtimeSourceRevision;
          gitBytes(['cat-file', '-e', `${sourceRevision}^{commit}`], 1);
          gitBytes(['merge-base', '--is-ancestor', sourceRevision, 'HEAD'], 1);
          const sourceTimestamp = Number(gitBytes(['show', '-s', '--format=%ct', sourceRevision], 64).toString('utf8').trim());
          if (sourceTimestamp !== quarantine.selectedRunner.sourceDateEpoch) {
            throw new Error('Selected runtime-source timestamp differs from immutable P.');
          }
          const quarantinedRevision = quarantine.quarantinedRunner.runtimeSourceRevision;
          gitBytes(['cat-file', '-e', `${quarantinedRevision}^{commit}`], 1);
          gitBytes(['merge-base', '--is-ancestor', quarantinedRevision, sourceRevision], 1);

          const historicLock = readCommitBlob(
            quarantine.quarantinedRunner.runtimeLock.revision,
            quarantine.quarantinedRunner.runtimeLock.path,
            { mode: '100644' },
            64 * 1024,
          ).bytes;
          const historicPlan = readCommitBlob(
            quarantine.quarantinedRunner.scientificPlan.revision,
            quarantine.quarantinedRunner.scientificPlan.path,
            { mode: '100644' },
            64 * 1024,
          ).bytes;
          if (sha256(historicLock) !== quarantine.quarantinedRunner.runtimeLock.rawDigest
              || sha256(historicPlan) !== quarantine.quarantinedRunner.scientificPlan.rawDigest) {
            throw new Error('Bootstrap quarantine is not bound to the historical runtime lock and scientific plan Git objects.');
          }

          const runtimeLock = JSON.parse(historicLock);
          const plan = JSON.parse(historicPlan);
          if (runtimeLock.schemaVersion !== 'tf.atomistic-runtime-lock/0.1'
              || runtimeLock.state !== 'discovery-not-frozen'
              || runtimeLock.scientificPlan?.path !== quarantine.quarantinedRunner.scientificPlan.path
              || runtimeLock.scientificPlan?.rawDigest !== quarantine.quarantinedRunner.scientificPlan.rawDigest
              || runtimeLock.runtimeSource?.revision !== quarantine.quarantinedRunner.runtimeSourceRevision
              || runtimeLock.identities?.runnerDigest !== null
              || runtimeLock.replication?.observations?.length !== quarantine.quarantinedRunner.acceptedReplicaCount
              || runtimeLock.claims?.evidenceClass !== 'discovery-only-not-reproduced'
              || runtimeLock.claims?.promotionEligible !== false
              || runtimeLock.claims?.comparable !== false
              || runtimeLock.claims?.reproduced !== false
              || plan.schemaVersion !== 'tf.atomistic-reproduction/0.2'
              || plan.status !== 'planned-not-reproduced') {
            throw new Error('Bootstrap quarantine, runtime lock, and scientific plan do not share the reviewed claim boundary.');
          }

          const runnerPaths = [
            ['scripts/atomistic/run_model.py', 'run_model.py'],
            ['scripts/atomistic/runtime_contract.py', 'runtime_contract.py'],
          ];
          if (!Array.isArray(runtimeLock.runtimeSource.files)) {
            throw new Error('Runtime lock has no source-file identities.');
          }
          const runnerFiles = runnerPaths.map(([path, name]) => {
            const matches = runtimeLock.runtimeSource.files.filter((entry) => entry?.path === path);
            if (matches.length !== 1 || matches[0].mode !== '100644'
                || !Number.isSafeInteger(matches[0].sizeBytes) || matches[0].sizeBytes < 1
                || !/^sha256:[0-9a-f]{64}$/.test(matches[0].sha256)) {
              throw new Error(`Runtime lock has no unique regular identity for ${path}.`);
            }
            const bytes = readCommitBlob(quarantinedRevision, path, matches[0], 5 * 1024 * 1024).bytes;
            if (bytes.length !== matches[0].sizeBytes || sha256(bytes) !== matches[0].sha256) {
              throw new Error(`Runtime source differs from the quarantined lock identity: ${path}`);
            }
            return { name, sha256: matches[0].sha256 };
          }).sort((left, right) => (left.name < right.name ? -1 : left.name > right.name ? 1 : 0));
          const lockedRunnerDigest = sha256(Buffer.from(canonicalJson(runnerFiles), 'utf8'));
          if (lockedRunnerDigest !== quarantine.quarantinedRunner.runnerDigest) {
            throw new Error('Bootstrap quarantine runner identity differs from the reviewed runtime lock.');
          }

          const candidateSources = quarantine.selectedRunner.sourceFiles.map((source) => {
            const object = readCommitBlob(sourceRevision, source.path, { mode: source.mode }, 5 * 1024 * 1024);
            return {
              ...source,
              bytes: object.bytes,
              actualGitBlobOid: object.gitBlobOid,
              actualSizeBytes: object.bytes.length,
              actualSha256: sha256(object.bytes),
            };
          });
          const candidateSourcesByPath = new Map(candidateSources.map((source) => [source.path, source]));
          const candidateMappings = quarantine.selectedRunner.materializations.map((mapping) => {
            const source = candidateSourcesByPath.get(mapping.sourcePath);
            if (source === undefined) {
              throw new Error(`BOOTSTRAP_RUNNER_NOT_SELECTED: missing-source=${mapping.sourcePath}`);
            }
            return { ...mapping, source };
          });
          const candidateLegacyProbe = candidateMappings.map(({ name, source }) => ({
            name,
            sha256: source.actualSha256,
          })).sort((left, right) => (left.name < right.name ? -1 : left.name > right.name ? 1 : 0));
          const candidateLegacyDigest = sha256(Buffer.from(canonicalJson(candidateLegacyProbe), 'utf8'));
          if (candidateLegacyDigest === quarantine.quarantinedRunner.runnerDigest) {
            throw new Error(
              `BOOTSTRAP_QUARANTINE_ACTIVE (${quarantine.quarantinedRunner.reasonCode}): ${quarantine.quarantinedRunner.reason} runner=${candidateLegacyDigest}; acceptedReplicaCount=0; runs ${quarantine.quarantinedRunner.nonRetroactiveRunIds.join(',')} cannot be retroactively accepted.`,
            );
          }
          const candidateSourceManifest = candidateSources.map((source) => ({
            path: source.path,
            sizeBytes: source.actualSizeBytes,
            mode: source.mode,
            sha256: source.actualSha256,
          }));
          const candidateSourceManifestDigest = sha256(Buffer.from(canonicalJson(candidateSourceManifest), 'utf8'));
          const candidateMaterializationDigest = sha256(Buffer.from(
            canonicalJson(quarantine.selectedRunner.materializations),
            'utf8',
          ));
          const candidateMappingIsExact = candidateSourcesByPath.size === candidateSources.length
            && candidateSources.every((source) => (
              source.actualGitBlobOid === source.gitBlobOid
              && source.actualSizeBytes === source.sizeBytes
              && source.actualSha256 === source.sha256
            ))
            && candidateMappings.every(({ source, ...mapping }) => (
              source.mode === mapping.mode
              && source.sizeBytes === mapping.sizeBytes
              && source.sha256 === mapping.sha256
            ))
            && candidateSourceManifestDigest === quarantine.selectedRunner.sourceManifestDigest
            && candidateMaterializationDigest === quarantine.selectedRunner.materializationDigest;
          const selectedRunnerFiles = candidateMappings.map(({ source, ...mapping }) => ({
            name: mapping.name,
            standardContainerPath: mapping.standardContainerPath,
            sizeBytes: source.actualSizeBytes,
            sha256: source.actualSha256,
          }));
          selectedRunnerFiles.sort((left, right) => (left.name < right.name ? -1 : left.name > right.name ? 1 : 0));
          const candidateRunnerDigest = sha256(Buffer.from(canonicalJson(selectedRunnerFiles), 'utf8'));
          if (!candidateMappingIsExact || candidateRunnerDigest !== quarantine.selectedRunner.runnerDigest) {
            throw new Error(`BOOTSTRAP_RUNNER_NOT_SELECTED: runner=${candidateRunnerDigest}`);
          }
          NODE

      - name: Create fresh, model-isolated working directories
        id: directories
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          task_root="$(mktemp -d "$RUNNER_TEMP/tailing-atomistic-${MODEL}.XXXXXX")"
          cache_root="$task_root/cache"
          wheelhouse="$task_root/wheelhouse"
          lock_dir="$task_root/locks"
          manifest_dir="$task_root/manifests"
          structure_dir="$task_root/structures"
          inference_input_dir="$task_root/inference-inputs"
          runtime_source_root="$task_root/runtime-source"
          build_context="$task_root/build-context"
          source_build_inputs="$task_root/source-build-inputs"
          source_build_a="$task_root/source-build-a"
          source_build_b="$task_root/source-build-b"
          output_dir="$task_root/output"
          publish_dir="$RUNNER_TEMP/tailing-atomistic-publish/$MODEL"
          install -d -m 0700 \
            "$cache_root" "$wheelhouse" "$lock_dir" "$manifest_dir" \
            "$structure_dir" "$inference_input_dir" "$runtime_source_root" "$build_context" \
            "$source_build_inputs/source" "$source_build_inputs/tools" \
            "$source_build_a" "$source_build_b" \
            "$output_dir" "$publish_dir"
          {
            echo "ATOMISTIC_ROOT=$task_root"
            echo "CACHE_ROOT=$cache_root"
            echo "WHEELHOUSE=$wheelhouse"
            echo "LOCK_DIR=$lock_dir"
            echo "MANIFEST_DIR=$manifest_dir"
            echo "STRUCTURE_DIR=$structure_dir"
            echo "INFERENCE_INPUT_DIR=$inference_input_dir"
            echo "RUNTIME_SOURCE_ROOT=$runtime_source_root"
            echo "BUILD_CONTEXT=$build_context"
            echo "SOURCE_BUILD_INPUTS=$source_build_inputs"
            echo "SOURCE_BUILD_A=$source_build_a"
            echo "SOURCE_BUILD_B=$source_build_b"
            echo "OUTPUT_DIR=$output_dir"
            echo "PUBLISH_DIR=$publish_dir"
          } >> "$GITHUB_ENV"

      - name: Bind paths and runner constants from the frozen plan
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import {
            appendFileSync,
            chmodSync,
            closeSync,
            constants as fsConstants,
            fstatSync,
            fsyncSync,
            lstatSync,
            mkdirSync,
            openSync,
            readSync,
            realpathSync,
            writeSync,
          } from 'node:fs';
          import path from 'node:path';

          const expectedRuntimeSourceRevision = 'f861b3e30572f1db366554a2e330d5d6c78bdb56';
          const expectedSourceDateEpoch = 1787977543;
