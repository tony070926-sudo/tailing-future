          const benchmark = benchmarks[0];
          const values = {
            MODEL_ID: model.id,
            PACKAGE_CACHE_PATH: model.package.cachePath,
            PACKAGE_FILENAME: model.package.filename,
            CHECKPOINT_CACHE_PATH: model.cachePath,
            CHECKPOINT_FILENAME: model.cachePath.split('/').at(-1),
            DATASET_CACHE_PATH: benchmark.cachePath,
            DATASET_FILENAME: benchmark.cachePath.split('/').at(-1),
            RUNTIME_SOURCE_REVISION: expectedRuntimeSourceRevision,
            SOURCE_DATE_EPOCH: String(expectedSourceDateEpoch),
