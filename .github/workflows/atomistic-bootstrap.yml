          const expectedMaterializationDigest = 'sha256:345d5e55227bbe873d567f5ea72b88db1f21c1d46e72f078db38e6a455d47721';
          const expectedSources = [
            { path: '.dockerignore', gitBlobOid: '7dd2587d66b2803b491e281044f90e4f654ab861', sizeBytes: 338, mode: '100644', sha256: 'sha256:9d49b6272e10c9c791f6c1288f6df858141bda4613085cc3a811d6edd4aa3ab3' },
            { path: 'atomistic/containers/mace.Dockerfile', gitBlobOid: '0edc70ad532de4470efff5c170a20f17a94c4847', sizeBytes: 3338, mode: '100644', sha256: 'sha256:d97f48e8d8d75c2b4d22acf46ec5aa7ba21cb2acd59db7a4745e2021f4438b5f' },
            { path: 'atomistic/containers/mattersim.Dockerfile', gitBlobOid: 'be08afa1d04a4078a559bf2d0eca1bd66eaebb0c', sizeBytes: 3533, mode: '100644', sha256: 'sha256:d672230adbc540391e8be4424aca24c50e473ca46a5a244d06838f55cc288455' },
