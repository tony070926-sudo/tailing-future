            --manifest "$LOCK_DIR/$MODEL.wheelhouse.manifest.json"
          test -f "$BUILD_CONTEXT/.dockerignore"
          test -f "$BUILD_CONTEXT/atomistic/containers/$MODEL.Dockerfile"
          test -f "$BUILD_CONTEXT/scripts/atomistic/run_model.py"
          test -f "$BUILD_CONTEXT/scripts/atomistic/runtime_contract.py"
          test -z "$(find "$BUILD_CONTEXT" -type l -print -quit)"
          for materialized in \
            "$BUILD_CONTEXT/.dockerignore" \
            "$BUILD_CONTEXT/atomistic/containers/$MODEL.Dockerfile" \
            "$BUILD_CONTEXT/scripts/atomistic/run_model.py" \
            "$BUILD_CONTEXT/scripts/atomistic/runtime_contract.py"; do
            test "$(stat -c '%a' "$materialized")" = 444
            test "$(stat -c '%h' "$materialized")" = 1
          done
          echo "9d49b6272e10c9c791f6c1288f6df858141bda4613085cc3a811d6edd4aa3ab3  $BUILD_CONTEXT/.dockerignore" | sha256sum -c -
          if [ "$MODEL" = mattersim ]; then
            echo "d672230adbc540391e8be4424aca24c50e473ca46a5a244d06838f55cc288455  $BUILD_CONTEXT/atomistic/containers/mattersim.Dockerfile" | sha256sum -c -
          else
            test "$MODEL" = mace
            echo "d97f48e8d8d75c2b4d22acf46ec5aa7ba21cb2acd59db7a4745e2021f4438b5f  $BUILD_CONTEXT/atomistic/containers/mace.Dockerfile" | sha256sum -c -
          fi
          echo "f0f0e2dd09784de064f2ba552a90a390523cd9af4244c0853118317bb42a36bb  $BUILD_CONTEXT/scripts/atomistic/run_model.py" | sha256sum -c -
          echo "0a7f2e6e92cfdaeea0a9b532b152fa32c3a562500d7e1962a1573a8b072c34e2  $BUILD_CONTEXT/scripts/atomistic/runtime_contract.py" | sha256sum -c -
          install -d -m 0700 "$BUILD_CONTEXT/atomistic/locks"
          test ! -e "$BUILD_CONTEXT/atomistic/locks/$MODEL.requirements.lock"
          install -m 0444 \
            "$LOCK_DIR/$MODEL.requirements.lock" \
            "$BUILD_CONTEXT/atomistic/locks/$MODEL.requirements.lock"
          test -z "$(find "$BUILD_CONTEXT" -type l -print -quit)"
          test -z "$(find "$BUILD_CONTEXT" -mindepth 1 ! -type d ! -type f -print -quit)"
          expected_context_directories="$(printf '%s\n' \
            './atomistic' \
            './atomistic/containers' \
            './atomistic/locks' \
            './scripts' \
            './scripts/atomistic')"
          actual_context_directories="$(cd "$BUILD_CONTEXT" && find . -mindepth 1 -type d -print | LC_ALL=C sort)"
          test "$actual_context_directories" = "$expected_context_directories"
          expected_context_files="$(printf '%s\n' \
            './.dockerignore' \
            "./atomistic/containers/$MODEL.Dockerfile" \
            "./atomistic/locks/$MODEL.requirements.lock" \
            './scripts/atomistic/run_model.py' \
            './scripts/atomistic/runtime_contract.py')"
          actual_context_files="$(cd "$BUILD_CONTEXT" && find . -type f -print | LC_ALL=C sort)"
          test "$actual_context_files" = "$expected_context_files"
          echo "d5174d4630d959ac3c93d4a75027ac0258e40a776b689d6ac98f62b61f4a5937  scripts/atomistic/runtime-input-contract.mjs" | sha256sum -c -
          node scripts/atomistic/runtime-input-contract.mjs verify-exact \
            --model "$MODEL" \
            --plan evaluation/atomistic/reproduction-plan.json \
            --wheelhouse-manifest "$LOCK_DIR/$MODEL.wheelhouse.manifest.json" \
            --dockerfile "$BUILD_CONTEXT/atomistic/containers/$MODEL.Dockerfile" \
            --dockerignore "$BUILD_CONTEXT/.dockerignore" \
            --dependency-lock "$BUILD_CONTEXT/atomistic/locks/$MODEL.requirements.lock" \
            --runner-source-root "$RUNTIME_SOURCE_ROOT" \
            --runner-build-root "$BUILD_CONTEXT" \
            --runtime-source-revision "$RUNTIME_SOURCE_REVISION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output "$LOCK_DIR/$MODEL.runtime-inputs.json" \
            > "$ATOMISTIC_ROOT/$MODEL.runtime-inputs.build-context.verify.json"
          cmp --silent \
            "$ATOMISTIC_ROOT/$MODEL.runtime-inputs.result.json" \
            "$ATOMISTIC_ROOT/$MODEL.runtime-inputs.build-context.verify.json"
          test "sha256:$(sha256sum "$LOCK_DIR/$MODEL.runtime-inputs.json" | cut -d ' ' -f 1)" = "$RUNTIME_INPUT_MANIFEST_DIGEST"
          image_tag="tailing-atomistic-$MODEL-bootstrap:$GITHUB_SHA"
          BUILDX_METADATA_PROVENANCE=disabled DOCKER_BUILDKIT=1 docker buildx build \
            --load \
            --no-cache \
            --pull=false \
            --network=none \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-context "wheelhouse=$WHEELHOUSE" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --label org.opencontainers.image.revision="$RUNTIME_SOURCE_REVISION" \
            --label org.tailing-future.evidence-class=bootstrap-not-reproduced \
            --metadata-file "$BUILD_CONTEXT/$MODEL.buildx-metadata.json" \
            --file "$BUILD_CONTEXT/atomistic/containers/$MODEL.Dockerfile" \
            --tag "$image_tag" \
            "$BUILD_CONTEXT"
          verify_frozen_wheelhouse
          docker image inspect "$image_tag" > "$BUILD_CONTEXT/$MODEL.image-inspect.json"
          docker buildx version > "$BUILD_CONTEXT/buildx-version.txt"
          docker version --format '{{.Server.Version}}' > "$BUILD_CONTEXT/docker-server-version.txt"
          echo "83b33e718297f1a90939e029ddfe407ab6e754b35ac2e5f6a27baf8de0143b18  scripts/atomistic/write-container-observation.mjs" | sha256sum -c -
          node scripts/atomistic/write-container-observation.mjs write-new \
            --model "$MODEL" \
            --runtime-source-revision "$RUNTIME_SOURCE_REVISION" \
            --workflow-revision "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --runtime-input-manifest "$LOCK_DIR/$MODEL.runtime-inputs.json" \
            --buildx-metadata "$BUILD_CONTEXT/$MODEL.buildx-metadata.json" \
            --image-inspect "$BUILD_CONTEXT/$MODEL.image-inspect.json" \
            --buildx-version "$BUILD_CONTEXT/buildx-version.txt" \
            --docker-server-version "$BUILD_CONTEXT/docker-server-version.txt" \
            --output "$BUILD_CONTEXT/$MODEL.container-observation.json" \
            > "$ATOMISTIC_ROOT/$MODEL.container-observation.result.json"
          node scripts/atomistic/write-container-observation.mjs verify-exact \
            --model "$MODEL" \
            --runtime-source-revision "$RUNTIME_SOURCE_REVISION" \
            --workflow-revision "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --runtime-input-manifest "$LOCK_DIR/$MODEL.runtime-inputs.json" \
            --buildx-metadata "$BUILD_CONTEXT/$MODEL.buildx-metadata.json" \
            --image-inspect "$BUILD_CONTEXT/$MODEL.image-inspect.json" \
            --buildx-version "$BUILD_CONTEXT/buildx-version.txt" \
            --docker-server-version "$BUILD_CONTEXT/docker-server-version.txt" \
            --output "$BUILD_CONTEXT/$MODEL.container-observation.json" \
            > "$ATOMISTIC_ROOT/$MODEL.container-observation.verify.json"
          cmp --silent \
            "$ATOMISTIC_ROOT/$MODEL.container-observation.result.json" \
            "$ATOMISTIC_ROOT/$MODEL.container-observation.verify.json"
          chmod 0444 "$BUILD_CONTEXT/$MODEL.container-observation.json"
          docker_local_config_image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          test "${docker_local_config_image_id#sha256:}" != "$docker_local_config_image_id"
          test "${#docker_local_config_image_id}" -eq 71
          {
            echo "IMAGE_TAG=$image_tag"
            echo "DOCKER_LOCAL_CONFIG_IMAGE_ID=$docker_local_config_image_id"
          } >> "$GITHUB_ENV"

      - name: Run checkpoint deserialization and smoke predictions in the final sandbox
        id: inference
        shell: bash
        run: |
          set -euo pipefail
          package_path="$CACHE_ROOT/$PACKAGE_CACHE_PATH"
          checkpoint_path="$CACHE_ROOT/$CHECKPOINT_CACHE_PATH"
          test -f "$package_path"
          test -f "$checkpoint_path"
          test -f "$STRUCTURE_DIR/structures.jsonl"
          test -f "$STRUCTURE_DIR/structures.manifest.json"
          install -m 0444 "$package_path" "$INFERENCE_INPUT_DIR/$PACKAGE_FILENAME"
          install -m 0444 "$checkpoint_path" "$INFERENCE_INPUT_DIR/$CHECKPOINT_FILENAME"
          install -m 0444 "$STRUCTURE_DIR/structures.jsonl" "$INFERENCE_INPUT_DIR/structures.jsonl"
          install -m 0444 "$STRUCTURE_DIR/structures.manifest.json" "$INFERENCE_INPUT_DIR/structures.manifest.json"
          install -m 0444 \
            "$GITHUB_WORKSPACE/evaluation/atomistic/reproduction-plan.json" \
            "$INFERENCE_INPUT_DIR/reproduction-plan.json"
          chmod 0555 "$INFERENCE_INPUT_DIR"
          sudo chown 65532:65532 "$OUTPUT_DIR"
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 90m \
          docker run --rm --platform=linux/amd64 \
            --network=none \
            --read-only \
            --user=65532:65532 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=256 \
            --cpus=2 \
            --memory=6g \
            --memory-swap=6g \
            --ulimit nofile=1024:1024 \
            --ulimit core=0:0 \
            --ulimit fsize=134217728:134217728 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777 \
            --env "TAILING_ATOMISTIC_WORKFLOW_REVISION=$GITHUB_SHA" \
            --env "TAILING_ATOMISTIC_RUNTIME_SOURCE_REVISION=$RUNTIME_SOURCE_REVISION" \
            --env "TAILING_ATOMISTIC_DOCKER_LOCAL_CONFIG_IMAGE_ID=$DOCKER_LOCAL_CONFIG_IMAGE_ID" \
            --mount "type=bind,src=$INFERENCE_INPUT_DIR/$PACKAGE_FILENAME,dst=/inputs/$PACKAGE_FILENAME,readonly" \
            --mount "type=bind,src=$INFERENCE_INPUT_DIR/$CHECKPOINT_FILENAME,dst=/inputs/$CHECKPOINT_FILENAME,readonly" \
            --mount "type=bind,src=$INFERENCE_INPUT_DIR/structures.jsonl,dst=/inputs/structures.jsonl,readonly" \
            --mount "type=bind,src=$INFERENCE_INPUT_DIR/structures.manifest.json,dst=/inputs/structures.manifest.json,readonly" \
            --mount "type=bind,src=$INFERENCE_INPUT_DIR/reproduction-plan.json,dst=/inputs/reproduction-plan.json,readonly" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/output" \
            "$IMAGE_TAG" \
              --model "$MODEL" \
              --mode smoke \
              --package "/inputs/$PACKAGE_FILENAME" \
              --checkpoint "/inputs/$CHECKPOINT_FILENAME" \
              --structures /inputs/structures.jsonl \
              --structure-manifest /inputs/structures.manifest.json \
              --output /output \
              --plan /inputs/reproduction-plan.json
          runner_status=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" "$OUTPUT_DIR"
          output_files="$(find "$OUTPUT_DIR" -type f | wc -l)"
          output_bytes="$(du -sb "$OUTPUT_DIR" | cut -f1)"
          test "$output_files" -le 20
          test "$output_bytes" -le 268435456
          exit "$runner_status"

      - name: Stage only non-promotional bootstrap outputs
        id: stage_outputs
        if: always()
        env:
          STAGE_GUARD: ${{ steps.guard.outcome }}
          STAGE_DIRECTORIES: ${{ steps.directories.outcome }}
          STAGE_BIND: ${{ steps.bind.outcome }}
          STAGE_BASE: ${{ steps.base.outcome }}
          STAGE_ASSETS: ${{ steps.assets.outcome }}
          STAGE_STRUCTURES: ${{ steps.structures.outcome }}
          STAGE_WHEELHOUSE: ${{ steps.wheelhouse.outcome }}
          STAGE_RESOLVE: ${{ steps.resolve.outcome }}
          STAGE_FREEZE: ${{ steps.freeze.outcome }}
          STAGE_COLD_INSTALL: ${{ steps.cold_install.outcome }}
          STAGE_BUILD: ${{ steps.build.outcome }}
          STAGE_INFERENCE: ${{ steps.inference.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          expected_publish_dir="$RUNNER_TEMP/tailing-atomistic-publish/$MODEL"
          if [ -n "${PUBLISH_DIR:-}" ]; then
            test "$PUBLISH_DIR" = "$expected_publish_dir"
          fi
          PUBLISH_DIR="$expected_publish_dir"
          fallback_root="$(mktemp -d "$RUNNER_TEMP/tailing-atomistic-stage-${MODEL}.XXXXXX")"
          install -d -m 0700 \
            "$fallback_root/locks" \
            "$fallback_root/manifests" \
            "$fallback_root/structures" \
            "$fallback_root/build-context" \
            "$fallback_root/output"
          LOCK_DIR="${LOCK_DIR:-$fallback_root/locks}"
          MANIFEST_DIR="${MANIFEST_DIR:-$fallback_root/manifests}"
          STRUCTURE_DIR="${STRUCTURE_DIR:-$fallback_root/structures}"
          BUILD_CONTEXT="${BUILD_CONTEXT:-$fallback_root/build-context}"
          OUTPUT_DIR="${OUTPUT_DIR:-$fallback_root/output}"
          install -d -m 0700 \
            "$PUBLISH_DIR/locks" \
            "$PUBLISH_DIR/manifests" \
            "$PUBLISH_DIR/predictions" \
            "$PUBLISH_DIR/diagnostics"
          copy_regular_if_present() {
            source_path="$1"
            destination_path="$2"
            if [ -e "$source_path" ]; then
              test -f "$source_path"
              test ! -L "$source_path"
              install -m 0444 "$source_path" "$destination_path"
            fi
          }
          verify_derived_pair() {
            python -B - \
              "$1" \
              "$2" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import stat
          import sys

          def read_regular(path, limit):
              metadata = os.lstat(path)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_size > limit:
                  raise ValueError("bootstrap provenance input is not one bounded regular file")
              with open(path, "rb") as handle:
                  content = handle.read(limit + 1)
              if len(content) != metadata.st_size or len(content) > limit:
                  raise ValueError("bootstrap provenance input changed or exceeded its bound")
              return content

          wheelhouse = json.loads(read_regular(sys.argv[1], 16 * 1024 * 1024))
          derived = read_regular(sys.argv[2], 8192)
          expected = wheelhouse.get("derivedWheelProvenance", {}).get("manifestDigest")
          actual = "sha256:" + hashlib.sha256(derived).hexdigest()
          if not isinstance(expected, str) or not hmac.compare_digest(expected, actual):
              raise ValueError("staged derived-wheel provenance differs from the resolver binding")
          PY
          }
          if [ "$MODEL" = mace ] \
            && [ -e "$LOCK_DIR/mace.wheelhouse.manifest.json" ] \
            && [ -e "$MANIFEST_DIR/python-hostlist.derived-wheel.manifest.json" ]; then
            verify_derived_pair \
              "$LOCK_DIR/mace.wheelhouse.manifest.json" \
              "$MANIFEST_DIR/python-hostlist.derived-wheel.manifest.json"
          fi
          copy_regular_if_present "$LOCK_DIR/$MODEL.requirements.lock" "$PUBLISH_DIR/locks/$MODEL.requirements.lock"
          copy_regular_if_present "$LOCK_DIR/$MODEL.wheelhouse.manifest.json" "$PUBLISH_DIR/manifests/$MODEL.wheelhouse.manifest.json"
          copy_regular_if_present "$LOCK_DIR/$MODEL.runtime-inputs.json" "$PUBLISH_DIR/manifests/$MODEL.runtime-inputs.json"
          copy_regular_if_present "$BUILD_CONTEXT/$MODEL.container-observation.json" "$PUBLISH_DIR/manifests/$MODEL.container-observation.json"
          copy_regular_if_present "$BUILD_CONTEXT/$MODEL.buildx-metadata.json" "$PUBLISH_DIR/diagnostics/$MODEL.buildx-metadata.json"
          copy_regular_if_present "$BUILD_CONTEXT/$MODEL.image-inspect.json" "$PUBLISH_DIR/diagnostics/$MODEL.image-inspect.json"
          copy_regular_if_present "$BUILD_CONTEXT/buildx-version.txt" "$PUBLISH_DIR/diagnostics/$MODEL.buildx-version.txt"
          copy_regular_if_present "$BUILD_CONTEXT/docker-server-version.txt" "$PUBLISH_DIR/diagnostics/$MODEL.docker-server-version.txt"
          copy_regular_if_present "$MANIFEST_DIR/fetched-assets.manifest.json" "$PUBLISH_DIR/manifests/fetched-assets.manifest.json"
          copy_regular_if_present "$MANIFEST_DIR/pytorch-download-sources.json" "$PUBLISH_DIR/manifests/pytorch-download-sources.json"
          copy_regular_if_present "$MANIFEST_DIR/python-hostlist.derived-wheel.manifest.json" "$PUBLISH_DIR/manifests/python-hostlist.derived-wheel.manifest.json"
          copy_regular_if_present "$STRUCTURE_DIR/structures.manifest.json" "$PUBLISH_DIR/manifests/structures.manifest.json"
          copy_regular_if_present "$OUTPUT_DIR/summary.json" "$PUBLISH_DIR/manifests/run-summary.json"
          copy_regular_if_present "$OUTPUT_DIR/predictions.jsonl" "$PUBLISH_DIR/predictions/predictions.jsonl"
          copy_regular_if_present "$OUTPUT_DIR/run-diagnostics.json" "$PUBLISH_DIR/diagnostics/run-diagnostics.json"
          copy_regular_if_present "$OUTPUT_DIR/diagnostics.json" "$PUBLISH_DIR/diagnostics/failure-diagnostics.json"
          if [ "$MODEL" = mace ] \
            && [ -e "$PUBLISH_DIR/manifests/mace.wheelhouse.manifest.json" ] \
            && [ -e "$PUBLISH_DIR/manifests/python-hostlist.derived-wheel.manifest.json" ]; then
            verify_derived_pair \
              "$PUBLISH_DIR/manifests/mace.wheelhouse.manifest.json" \
              "$PUBLISH_DIR/manifests/python-hostlist.derived-wheel.manifest.json"
          fi
          echo "1f4198da6874f2ad10138c4b7ee030ed8a05f22d6c4d55deab5fe622d3728684  scripts/atomistic/write_bootstrap_outcome.py" | sha256sum -c -
          python -B scripts/atomistic/write_bootstrap_outcome.py \
            --model "$MODEL" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --publish-root "$PUBLISH_DIR" \
            --stage "guard=$STAGE_GUARD" \
            --stage "directories=$STAGE_DIRECTORIES" \
            --stage "bind=$STAGE_BIND" \
            --stage "base=$STAGE_BASE" \
            --stage "assets=$STAGE_ASSETS" \
            --stage "structures=$STAGE_STRUCTURES" \
            --stage "wheelhouse=$STAGE_WHEELHOUSE" \
            --stage "resolve=$STAGE_RESOLVE" \
            --stage "freeze=$STAGE_FREEZE" \
            --stage "cold-install=$STAGE_COLD_INSTALL" \
            --stage "build=$STAGE_BUILD" \
            --stage "inference=$STAGE_INFERENCE"
          test -n "$(find "$PUBLISH_DIR" -type f -print -quit)"
          test -z "$(find "$PUBLISH_DIR" -type l -print -quit)"

      - name: Upload the allowlisted bootstrap bundle
        if: always() && steps.stage_outputs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailing-atomistic-bootstrap-${{ matrix.model }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tailing-atomistic-publish/${{ matrix.model }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
