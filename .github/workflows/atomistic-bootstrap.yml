      - name: Verify and pull the pinned Linux amd64 base and Dockerfile frontend
        id: base
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx imagetools inspect --raw "$BASE_IMAGE" > "$ATOMISTIC_ROOT/base-image-index.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const index = JSON.parse(readFileSync(`${process.env.ATOMISTIC_ROOT}/base-image-index.json`, 'utf8'));
          if (!Array.isArray(index.manifests)) throw new Error('Pinned base reference did not resolve to an OCI index.');
          const matches = index.manifests.filter((entry) =>
            entry.platform?.os === 'linux' && entry.platform?.architecture === 'amd64');
          if (matches.length !== 1 || matches[0].digest !== process.env.BASE_IMAGE_AMD64_DIGEST) {
            throw new Error('Pinned base image Linux/amd64 manifest digest drifted.');
          }
          NODE
          docker pull --platform=linux/amd64 "$BASE_IMAGE"
          docker pull "$DOCKERFILE_FRONTEND"
          docker run --rm --platform=linux/amd64 \
            --network=none \
            --read-only \
            --user="$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=64 \
            --cpus=1 \
            --memory=512m \
            --memory-swap=512m \
            --ulimit nofile=256:256 \
            "$BASE_IMAGE" \
            python -c 'import platform, sys; assert platform.machine() == "x86_64"; assert platform.system() == "Linux"; assert platform.python_version() == "3.12.13"; assert sys.implementation.name == "cpython"'

      - name: Fetch and hash-check the selected assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/atomistic/fetch-assets.mjs \
            --cache-root "$CACHE_ROOT" \
            --model "$MODEL" \
            > "$MANIFEST_DIR/fetched-assets.manifest.json"

      - name: Preprocess structures without mounting any model checkpoint
        id: structures
        shell: bash
        run: |
          set -euo pipefail
          dataset_path="$CACHE_ROOT/$DATASET_CACHE_PATH"
          test -f "$dataset_path"
          docker run --rm --platform=linux/amd64 \
            --network=none \
            --read-only \
            --user="$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=64 \
            --cpus=1 \
            --memory=1g \
            --memory-swap=1g \
            --ulimit nofile=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$dataset_path,dst=/input/$DATASET_FILENAME,readonly" \
            --mount "type=bind,src=$STRUCTURE_DIR,dst=/output" \
            "$BASE_IMAGE" \
            python -B /repo/scripts/atomistic/prepare_structures.py \
              --dataset "/input/$DATASET_FILENAME" \
              --output /output \
              --plan /repo/evaluation/atomistic/reproduction-plan.json
          test -f "$STRUCTURE_DIR/structures.jsonl"
          test -f "$STRUCTURE_DIR/structures.manifest.json"

      - name: Download one fresh resolved wheelhouse in the online phase
        id: wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          package_path="$CACHE_ROOT/$PACKAGE_CACHE_PATH"
          test -f "$package_path"
          test -z "$(find "$WHEELHOUSE" -mindepth 1 -maxdepth 1 -print -quit)"
          if [ "$MODEL" = mace ]; then
            test -z "$(find "$SOURCE_BUILD_INPUTS/source" -mindepth 1 -maxdepth 1 -print -quit)"
            test -z "$(find "$SOURCE_BUILD_INPUTS/tools" -mindepth 1 -maxdepth 1 -print -quit)"
            docker run --rm --platform=linux/amd64 \
              --network=bridge \
              --read-only \
              --user="$(id -u):$(id -g)" \
              --cap-drop=ALL \
              --security-opt=no-new-privileges=true \
              --pids-limit=32 \
              --cpus=1 \
              --memory=256m \
              --memory-swap=256m \
              --ulimit nofile=64:64 \
              --ulimit fsize=2097152:2097152 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
              --mount "type=bind,src=$SOURCE_BUILD_INPUTS,dst=/inputs" \
              "$BASE_IMAGE" \
              python -c '
          import hashlib
          import os
          import urllib.request

          assets = (
              (
                  "https://files.pythonhosted.org/packages/90/cc/bb6395c3f2b6bb739b1d3fc0e71f94e6a1c2e256df496237cbfd13cd74a6/python_hostlist-2.3.0.tar.gz",
