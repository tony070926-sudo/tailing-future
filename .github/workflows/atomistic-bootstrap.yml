          function safeTarget(root, relativePath) {
            if (typeof relativePath !== 'string' || relativePath.startsWith('/') || relativePath.includes('\\')
                || relativePath.split('/').some((part) => part === '' || part === '.' || part === '..')) {
              throw new Error(`Unsafe materialization path: ${relativePath}`);
            }
            const target = path.join(root, ...relativePath.split('/'));
            const relative = path.relative(root, target);
            if (relative === '' || relative.startsWith(`..${path.sep}`) || path.isAbsolute(relative)) {
              throw new Error(`Materialization escaped its isolated root: ${relativePath}`);
            }
            return target;
          }

          function writeExclusiveRegular(root, relativePath, bytes, expectedSha256) {
            const target = safeTarget(root, relativePath);
            mkdirSync(path.dirname(target), { recursive: true, mode: 0o700 });
            const descriptor = openSync(
              target,
              fsConstants.O_WRONLY | fsConstants.O_CREAT | fsConstants.O_EXCL | fsConstants.O_NOFOLLOW,
              0o400,
            );
            try {
              let offset = 0;
              while (offset < bytes.length) {
                const count = writeSync(descriptor, bytes, offset, bytes.length - offset, null);
                if (count === 0) throw new Error(`Materialization made no progress at ${relativePath}.`);
                offset += count;
