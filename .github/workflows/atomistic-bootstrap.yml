# Bootstrap-only prediction workflow.
#
# This workflow deliberately does not compute metrics, create a reproduction
# receipt, attest an artifact, or make a reproduced/superiority claim. Its
# artifacts are untrusted inputs for a later independent verifier.
name: Atomistic bootstrap predictions (non-promotional)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomistic-bootstrap-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_IMAGE: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
  BASE_IMAGE_AMD64_DIGEST: sha256:6e13e65c55e33adf203d77ee371cf8bf5d81bd4902ef07565721f46bf44917af
  DOCKERFILE_FRONTEND: docker/dockerfile:1.7@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e

jobs:
  bootstrap:
    name: ${{ matrix.model }} isolated bootstrap smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [mattersim, mace]
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Check out the dispatched revision without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned JavaScript runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0

      - name: Refuse non-main, non-Linux, or non-x86_64 dispatches
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import {
            closeSync,
            constants as fsConstants,
            fstatSync,
            openSync,
            readSync,
          } from 'node:fs';

          const quarantinePath = 'evaluation/atomistic/bootstrap-quarantine.json';
          const expectedQuarantineRawDigest = 'sha256:b20ad79d1360b4482373f837421c73214d6fcf47aafe0bfa6ed6eea99bb6f17f';
          const expectedQuarantine = {
            schemaVersion: 'tf.atomistic-bootstrap-quarantine/0.1',
            state: 'active',
            runnerDigest: 'sha256:2c708fc0220808cc4b2e2f3043623f604793f7bd8a5913472440f91f17a3987c',
            runnerDigestProtocol: 'sha256-canonical-json-sorted-runner-file-identities/v1',
            runtimeSourceRevision: '9a67f4509588d242838c736a580b6ec5badc18f9',
            runtimeLock: {
              path: 'evaluation/atomistic/runtime-lock.json',
              rawDigest: 'sha256:79e72ba821cfaac298a4898a9b09bd4f0159d3560cdf8f2ac5ba4b005402f6fe',
            },
            scientificPlan: {
              path: 'evaluation/atomistic/reproduction-plan.json',
              rawDigest: 'sha256:d3a58524029b51c598d00a7bb9f60b6479a9973a0f9907cbf94a31e61bf1c9c2',
            },
            reasonCode: 'contradictory-bootstrap-promotion-claim',
            reason: 'The locked R5 runner emits environment.provenance.promotionEligible=true in bootstrap-not-reproduced output and conflates workflow and runtime-source revisions.',
            acceptedReplicaCount: 0,
            nonRetroactiveRunIds: [33231316217, 33231323492],
          };

          function sha256(bytes) {
            return `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          }

          function canonicalJson(value) {
            if (value === null) return 'null';
            if (Array.isArray(value)) return `[${value.map((entry) => canonicalJson(entry)).join(',')}]`;
            if (typeof value === 'object') {
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          }

          function readBoundedRegularFile(path, maximumBytes) {
            const descriptor = openSync(path, fsConstants.O_RDONLY | fsConstants.O_NOFOLLOW);
            try {
              const before = fstatSync(descriptor, { bigint: true });
              if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1n
                  || before.size < 1n || before.size > BigInt(maximumBytes)) {
                throw new Error(`${path} is not one bounded regular file.`);
              }
              const bytes = Buffer.alloc(Number(before.size));
              let offset = 0;
              while (offset < bytes.length) {
                const count = readSync(descriptor, bytes, offset, bytes.length - offset, null);
                if (count === 0) throw new Error(`${path} changed while it was read.`);
                offset += count;
              }
              if (readSync(descriptor, Buffer.alloc(1), 0, 1, null) !== 0) {
                throw new Error(`${path} exceeded its byte bound while it was read.`);
              }
              const after = fstatSync(descriptor, { bigint: true });
              if (before.dev !== after.dev || before.ino !== after.ino || before.size !== after.size
                  || before.mtimeNs !== after.mtimeNs || before.ctimeNs !== after.ctimeNs) {
                throw new Error(`${path} changed while it was read.`);
              }
              return bytes;
            } finally {
              closeSync(descriptor);
            }
          }

          const quarantineBytes = readBoundedRegularFile(quarantinePath, 4096);
          if (sha256(quarantineBytes) !== expectedQuarantineRawDigest) {
            throw new Error('Bootstrap quarantine bytes differ from the reviewed policy.');
          }
          const quarantine = JSON.parse(quarantineBytes);
          if (JSON.stringify(quarantine) !== JSON.stringify(expectedQuarantine)) {
            throw new Error('Bootstrap quarantine schema or values differ from the reviewed policy.');
          }

          const runtimeLockBytes = readBoundedRegularFile(quarantine.runtimeLock.path, 64 * 1024);
          const planBytes = readBoundedRegularFile(quarantine.scientificPlan.path, 64 * 1024);
          if (sha256(runtimeLockBytes) !== quarantine.runtimeLock.rawDigest
              || sha256(planBytes) !== quarantine.scientificPlan.rawDigest) {
            throw new Error('Bootstrap quarantine is not bound to the reviewed runtime lock and scientific plan.');
          }
          const runtimeLock = JSON.parse(runtimeLockBytes);
          const plan = JSON.parse(planBytes);
          if (runtimeLock.schemaVersion !== 'tf.atomistic-runtime-lock/0.1'
              || runtimeLock.state !== 'discovery-not-frozen'
              || runtimeLock.scientificPlan?.path !== quarantine.scientificPlan.path
              || runtimeLock.scientificPlan?.rawDigest !== quarantine.scientificPlan.rawDigest
              || runtimeLock.runtimeSource?.revision !== quarantine.runtimeSourceRevision
              || runtimeLock.identities?.runnerDigest !== null
              || runtimeLock.replication?.observations?.length !== quarantine.acceptedReplicaCount
              || runtimeLock.claims?.evidenceClass !== 'discovery-only-not-reproduced'
              || runtimeLock.claims?.promotionEligible !== false
              || runtimeLock.claims?.comparable !== false
              || runtimeLock.claims?.reproduced !== false
              || plan.schemaVersion !== 'tf.atomistic-reproduction/0.2'
              || plan.status !== 'planned-not-reproduced') {
            throw new Error('Bootstrap quarantine, runtime lock, and scientific plan do not share the reviewed claim boundary.');
          }

          const runnerPaths = [
            ['scripts/atomistic/run_model.py', 'run_model.py'],
            ['scripts/atomistic/runtime_contract.py', 'runtime_contract.py'],
          ];
          if (!Array.isArray(runtimeLock.runtimeSource.files)) {
            throw new Error('Runtime lock has no source-file identities.');
          }
          const runnerFiles = runnerPaths.map(([path, name]) => {
            const matches = runtimeLock.runtimeSource.files.filter((entry) => entry?.path === path);
            if (matches.length !== 1 || matches[0].mode !== '100644'
                || !Number.isSafeInteger(matches[0].sizeBytes) || matches[0].sizeBytes < 1
                || !/^sha256:[0-9a-f]{64}$/.test(matches[0].sha256)) {
              throw new Error(`Runtime lock has no unique regular identity for ${path}.`);
            }
            const bytes = readBoundedRegularFile(path, 5 * 1024 * 1024);
            if (bytes.length !== matches[0].sizeBytes || sha256(bytes) !== matches[0].sha256) {
              throw new Error(`Runtime source differs from the quarantined lock identity: ${path}`);
            }
            return { name, sha256: matches[0].sha256 };
          }).sort((left, right) => (left.name < right.name ? -1 : left.name > right.name ? 1 : 0));
          const lockedRunnerDigest = sha256(Buffer.from(canonicalJson(runnerFiles), 'utf8'));
          if (lockedRunnerDigest !== quarantine.runnerDigest) {
            throw new Error('Bootstrap quarantine runner identity differs from the reviewed runtime lock.');
          }
          throw new Error(
            `BOOTSTRAP_QUARANTINE_ACTIVE (${quarantine.reasonCode}): ${quarantine.reason} runner=${lockedRunnerDigest}; acceptedReplicaCount=0; runs ${quarantine.nonRetroactiveRunIds.join(',')} cannot be retroactively accepted.`,
          );
          NODE

      - name: Create fresh, model-isolated working directories
        id: directories
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          task_root="$(mktemp -d "$RUNNER_TEMP/tailing-atomistic-${MODEL}.XXXXXX")"
          cache_root="$task_root/cache"
          wheelhouse="$task_root/wheelhouse"
          lock_dir="$task_root/locks"
          manifest_dir="$task_root/manifests"
          structure_dir="$task_root/structures"
          inference_input_dir="$task_root/inference-inputs"
          build_context="$task_root/build-context"
          source_build_inputs="$task_root/source-build-inputs"
          source_build_a="$task_root/source-build-a"
          source_build_b="$task_root/source-build-b"
          output_dir="$task_root/output"
          publish_dir="$RUNNER_TEMP/tailing-atomistic-publish/$MODEL"
          install -d -m 0700 \
            "$cache_root" "$wheelhouse" "$lock_dir" "$manifest_dir" \
            "$structure_dir" "$inference_input_dir" "$build_context" \
            "$source_build_inputs/source" "$source_build_inputs/tools" \
            "$source_build_a" "$source_build_b" \
            "$output_dir" "$publish_dir"
          {
            echo "ATOMISTIC_ROOT=$task_root"
            echo "CACHE_ROOT=$cache_root"
            echo "WHEELHOUSE=$wheelhouse"
            echo "LOCK_DIR=$lock_dir"
            echo "MANIFEST_DIR=$manifest_dir"
            echo "STRUCTURE_DIR=$structure_dir"
            echo "INFERENCE_INPUT_DIR=$inference_input_dir"
            echo "BUILD_CONTEXT=$build_context"
            echo "SOURCE_BUILD_INPUTS=$source_build_inputs"
            echo "SOURCE_BUILD_A=$source_build_a"
            echo "SOURCE_BUILD_B=$source_build_b"
            echo "OUTPUT_DIR=$output_dir"
            echo "PUBLISH_DIR=$publish_dir"
          } >> "$GITHUB_ENV"

      - name: Bind paths and runner constants from the frozen plan
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, lstatSync, readFileSync } from 'node:fs';

          const planBytes = readFileSync('evaluation/atomistic/reproduction-plan.json');
          const plan = JSON.parse(planBytes);
          const runtimeLockBytes = readFileSync('evaluation/atomistic/runtime-lock.json');
          const runtimeLock = JSON.parse(runtimeLockBytes);
          const planDigest = `sha256:${createHash('sha256').update(planBytes).digest('hex')}`;
          const runtimeLockDigest = `sha256:${createHash('sha256').update(runtimeLockBytes).digest('hex')}`;
          const expectedModelIds = {
            mattersim: 'mattersim-v1.0.0-5m',
            mace: 'mace-mpa-0-medium',
          };
          const expectedRunner = {
            python: '3.12.13',
            platform: 'linux',
            architecture: 'x86_64',
            baseImage: process.env.BASE_IMAGE,
            baseImageAmd64Digest: process.env.BASE_IMAGE_AMD64_DIGEST,
            dtype: 'float32',
            canonicalDevice: 'cpu',
            batchSize: 1,
            threads: 1,
            networkPolicy: 'fetch-online-run-offline',
            isolation: 'verified-pickle-in-networkless-unprivileged-read-only-container',
          };
          if (plan.schemaVersion !== 'tf.atomistic-reproduction/0.2') {
            throw new Error('Unexpected atomistic reproduction-plan schema.');
          }
          if (runtimeLock.schemaVersion !== 'tf.atomistic-runtime-lock/0.1'
              || runtimeLockDigest !== 'sha256:79e72ba821cfaac298a4898a9b09bd4f0159d3560cdf8f2ac5ba4b005402f6fe'
              || runtimeLock.state !== 'discovery-not-frozen'
              || runtimeLock.scientificPlan?.rawDigest !== planDigest
              || runtimeLock.claims?.evidenceClass !== 'discovery-only-not-reproduced'
              || runtimeLock.claims?.promotionEligible !== false
              || !/^[0-9a-f]{40}$/.test(runtimeLock.runtimeSource?.revision)
              || !Number.isSafeInteger(runtimeLock.runtimeSource?.commitTimestamp)) {
            throw new Error('Runtime discovery lock is incomplete or not bound to the scientific plan.');
          }
          for (const source of runtimeLock.runtimeSource.files) {
            const metadata = lstatSync(source.path, { bigint: true });
            const bytes = readFileSync(source.path);
            const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
            if (!metadata.isFile() || metadata.isSymbolicLink() || metadata.nlink !== 1n
                || Number(metadata.size) !== source.sizeBytes || digest !== source.sha256) {
              throw new Error(`Runtime source differs from the frozen R5 byte identity: ${source.path}`);
            }
          }
          const gitEnvironment = {
            ...process.env,
            GIT_CONFIG_NOSYSTEM: '1',
            GIT_NO_REPLACE_OBJECTS: '1',
            GIT_OPTIONAL_LOCKS: '0',
            LC_ALL: 'C',
          };
          for (const key of ['GIT_DIR', 'GIT_WORK_TREE', 'GIT_INDEX_FILE', 'GIT_OBJECT_DIRECTORY', 'GIT_ALTERNATE_OBJECT_DIRECTORIES', 'GIT_REPLACE_REF_BASE']) {
            delete gitEnvironment[key];
          }
          const gitOptions = { env: gitEnvironment, stdio: ['ignore', 'pipe', 'pipe'] };
          execFileSync('git', ['cat-file', '-e', `${runtimeLock.runtimeSource.revision}^{commit}`], gitOptions);
          execFileSync('git', ['merge-base', '--is-ancestor', runtimeLock.runtimeSource.revision, 'HEAD'], gitOptions);
          const commitTimestamp = Number(execFileSync(
            'git',
            ['show', '-s', '--format=%ct', runtimeLock.runtimeSource.revision],
            { ...gitOptions, encoding: 'utf8' },
          ).trim());
          if (commitTimestamp !== runtimeLock.runtimeSource.commitTimestamp) {
            throw new Error('Runtime source commit timestamp differs from the discovery lock.');
          }
          execFileSync(
            'git',
            ['diff', '--quiet', runtimeLock.runtimeSource.revision, '--', ...runtimeLock.runtimeSource.files.map((source) => source.path)],
            gitOptions,
          );
          for (const [field, expected] of Object.entries(expectedRunner)) {
            if (plan.protocol?.runner?.[field] !== expected) {
              throw new Error(`Runner plan drifted at ${field}.`);
            }
          }
          const modelId = expectedModelIds[process.env.MODEL];
          const models = plan.models.filter((entry) => entry.id === modelId);
          const benchmarks = plan.benchmarks.filter((entry) => entry.role === 'primary-like-for-like');
          if (models.length !== 1 || benchmarks.length !== 1) {
            throw new Error('Expected exactly one selected model and primary benchmark.');
          }
          const model = models[0];
          const benchmark = benchmarks[0];
          const values = {
            MODEL_ID: model.id,
            PACKAGE_CACHE_PATH: model.package.cachePath,
            PACKAGE_FILENAME: model.package.filename,
            CHECKPOINT_CACHE_PATH: model.cachePath,
            CHECKPOINT_FILENAME: model.cachePath.split('/').at(-1),
            DATASET_CACHE_PATH: benchmark.cachePath,
            DATASET_FILENAME: benchmark.cachePath.split('/').at(-1),
            RUNTIME_SOURCE_REVISION: runtimeLock.runtimeSource.revision,
            SOURCE_DATE_EPOCH: String(runtimeLock.runtimeSource.commitTimestamp),
          };
          for (const [name, value] of Object.entries(values)) {
            if (typeof value !== 'string' || !/^[A-Za-z0-9._/+\-]+$/.test(value) || value.includes('..')) {
              throw new Error(`Unsafe ${name} in reproduction plan.`);
            }
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE

      - name: Verify and pull the pinned Linux amd64 base and Dockerfile frontend
        id: base
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx imagetools inspect --raw "$BASE_IMAGE" > "$ATOMISTIC_ROOT/base-image-index.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const index = JSON.parse(readFileSync(`${process.env.ATOMISTIC_ROOT}/base-image-index.json`, 'utf8'));
          if (!Array.isArray(index.manifests)) throw new Error('Pinned base reference did not resolve to an OCI index.');
          const matches = index.manifests.filter((entry) =>
            entry.platform?.os === 'linux' && entry.platform?.architecture === 'amd64');
          if (matches.length !== 1 || matches[0].digest !== process.env.BASE_IMAGE_AMD64_DIGEST) {
            throw new Error('Pinned base image Linux/amd64 manifest digest drifted.');
          }
          NODE
          docker pull --platform=linux/amd64 "$BASE_IMAGE"
          docker pull "$DOCKERFILE_FRONTEND"
          docker run --rm --platform=linux/amd64 \
            --network=none \
            --read-only \
            --user="$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=64 \
            --cpus=1 \
            --memory=512m \
            --memory-swap=512m \
            --ulimit nofile=256:256 \
            "$BASE_IMAGE" \
            python -c 'import platform, sys; assert platform.machine() == "x86_64"; assert platform.system() == "Linux"; assert platform.python_version() == "3.12.13"; assert sys.implementation.name == "cpython"'

      - name: Fetch and hash-check the selected assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/atomistic/fetch-assets.mjs \
            --cache-root "$CACHE_ROOT" \
            --model "$MODEL" \
            > "$MANIFEST_DIR/fetched-assets.manifest.json"

      - name: Preprocess structures without mounting any model checkpoint
        id: structures
        shell: bash
        run: |
          set -euo pipefail
          dataset_path="$CACHE_ROOT/$DATASET_CACHE_PATH"
          test -f "$dataset_path"
          docker run --rm --platform=linux/amd64 \
            --network=none \
            --read-only \
            --user="$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --pids-limit=64 \
            --cpus=1 \
            --memory=1g \
            --memory-swap=1g \
            --ulimit nofile=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$dataset_path,dst=/input/$DATASET_FILENAME,readonly" \
            --mount "type=bind,src=$STRUCTURE_DIR,dst=/output" \
            "$BASE_IMAGE" \
            python -B /repo/scripts/atomistic/prepare_structures.py \
              --dataset "/input/$DATASET_FILENAME" \
              --output /output \
              --plan /repo/evaluation/atomistic/reproduction-plan.json
          test -f "$STRUCTURE_DIR/structures.jsonl"
          test -f "$STRUCTURE_DIR/structures.manifest.json"

      - name: Download one fresh resolved wheelhouse in the online phase
        id: wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          package_path="$CACHE_ROOT/$PACKAGE_CACHE_PATH"
          test -f "$package_path"
          test -z "$(find "$WHEELHOUSE" -mindepth 1 -maxdepth 1 -print -quit)"
          if [ "$MODEL" = mace ]; then
            test -z "$(find "$SOURCE_BUILD_INPUTS/source" -mindepth 1 -maxdepth 1 -print -quit)"
            test -z "$(find "$SOURCE_BUILD_INPUTS/tools" -mindepth 1 -maxdepth 1 -print -quit)"
            docker run --rm --platform=linux/amd64 \
              --network=bridge \
              --read-only \
              --user="$(id -u):$(id -g)" \
              --cap-drop=ALL \
              --security-opt=no-new-privileges=true \
              --pids-limit=32 \
              --cpus=1 \
              --memory=256m \
              --memory-swap=256m \
              --ulimit nofile=64:64 \
              --ulimit fsize=2097152:2097152 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
              --mount "type=bind,src=$SOURCE_BUILD_INPUTS,dst=/inputs" \
              "$BASE_IMAGE" \
              python -c '
          import hashlib
          import os
          import urllib.request

          assets = (
              (
                  "https://files.pythonhosted.org/packages/90/cc/bb6395c3f2b6bb739b1d3fc0e71f94e6a1c2e256df496237cbfd13cd74a6/python_hostlist-2.3.0.tar.gz",
                  "/inputs/source/python_hostlist-2.3.0.tar.gz",
                  37326,
                  "e1a0b18e525a5fca573cb9862799f11b3f2bd3ba7aec70c4ecd8b95341bb71ea",
              ),
              (
                  "https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl",
                  "/inputs/tools/setuptools-80.9.0-py3-none-any.whl",
                  1201486,
                  "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922",
              ),
              (
                  "https://files.pythonhosted.org/packages/0b/2c/87f3254fd8ffd29e4c02732eee68a83a1d3c346ae39bc6822dcbcb697f2b/wheel-0.45.1-py3-none-any.whl",
                  "/inputs/tools/wheel-0.45.1-py3-none-any.whl",
                  72494,
                  "708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248",
              ),
          )
          for url, destination, expected_size, expected_sha256 in assets:
              partial = destination + ".partial"
              request = urllib.request.Request(url, headers={"User-Agent": "tailing-future-atomistic-bootstrap/0.3.1"})
              digest = hashlib.sha256()
              written = 0
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(partial, flags, 0o600)
              try:
                  with os.fdopen(descriptor, "wb", closefd=True) as output, urllib.request.urlopen(request, timeout=60) as response:
                      if response.geturl() != url:
                          raise RuntimeError("immutable PyPI file URL redirected")
                      while True:
                          chunk = response.read(65536)
                          if not chunk:
                              break
                          written += len(chunk)
                          if written > expected_size:
                              raise RuntimeError("download exceeded frozen size")
                          digest.update(chunk)
                          output.write(chunk)
                      output.flush()
                      os.fsync(output.fileno())
                  if written != expected_size or digest.hexdigest() != expected_sha256:
                      raise RuntimeError("download differs from frozen size or digest")
                  os.chmod(partial, 0o444)
                  os.replace(partial, destination)
              except BaseException:
                  try:
                      os.unlink(partial)
                  except FileNotFoundError:
                      pass
                  raise
          '
            echo "e1a0b18e525a5fca573cb9862799f11b3f2bd3ba7aec70c4ecd8b95341bb71ea  $SOURCE_BUILD_INPUTS/source/python_hostlist-2.3.0.tar.gz" | sha256sum -c -
            echo "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922  $SOURCE_BUILD_INPUTS/tools/setuptools-80.9.0-py3-none-any.whl" | sha256sum -c -
            echo "708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248  $SOURCE_BUILD_INPUTS/tools/wheel-0.45.1-py3-none-any.whl" | sha256sum -c -
            echo "dffc06ecc2faab2b6e0fe729ac1c16dda524edff76297a06e20b839832e1e120  atomistic/locks/python-hostlist-build.requirements.lock" | sha256sum -c -
